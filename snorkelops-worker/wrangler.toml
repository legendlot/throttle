name = "snorkelops"
main = "src/index.js"
compatibility_date = "2026-05-28"
workers_dev = true

# Snorkel — LOT Procurement system worker.
# Reads/writes the SAME `store` schema tables as lotopsproxy (purchase_orders,
# po_lines, vendors, forwarders, vendor_supplied_items, company_addresses,
# reorder_requests, hsn_gst_rates) plus shared masters it consumes
# (stock_ledger, material_current, bom_*, public.product_master). service_role
# is the only DB client — no cross-worker calls.

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_SERVICE_KEY   (Supabase service_role key — same project as lotopsproxy)

# Service binding to ignitionops — the Ignition payment-request status push (Reann #2 S2,
# plan docs/superpowers/plans/2026-11-09-ignition-snorkel-payment-requests.md). A public
# workers.dev fetch between two workers on the same zone is blocked by Cloudflare error 1042.
# Auth travels on the request (secret IGNITION_INTERNAL_TOKEN) — the binding is transport, not trust.
[[services]]
binding = "IGNITIONOPS"
service = "ignitionops"

# Run next to the database (Supabase lot-production = AWS ap-south-1, Mumbai). Measured 2026-11-13:
# requests from India executed in Marseille, so every Supabase call crossed Europe<->Mumbai.
# A region hint, not mode = "smart" (that needs traffic from several locations). Proven on
# lotopsproxy first (calls ~40% faster, client IP preserved). Verify: `cf-placement` response
# header. Roll back: delete this block and redeploy. Kept LAST in the file on purpose — a table
# header placed above top-level keys would swallow them.
[placement]
region = "aws:ap-south-1"
