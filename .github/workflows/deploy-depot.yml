name: Deploy Depot

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Depot
        run: |
          set -o pipefail
          npx turbo build --filter=@throttle/depot 2>&1 | tee /tmp/build-output.log
          bash .github/scripts/check-build-output.sh /tmp/build-output.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.NEXT_PUBLIC_LOTOPS_URL }}

      - name: Deploy to legendlot/depot
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY_DEPOT }}
          external_repository: legendlot/depot
          publish_branch: gh-pages
          publish_dir: apps/depot/out
          cname: depot.legendoftoys.com
          commit_message: 'deploy: Depot dispatch back-office (LOT Monorepo)'
          force_orphan: true

      # PATTERN-168 — a green gh-pages push is NOT a live deploy. Pages builds
      # asynchronously and can silently ERROR, serving the old build for days.
      # Fail-soft on auth: a monitoring gap must not become a deploy outage.
      - name: Verify GitHub Pages published
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bash .github/scripts/verify-pages.sh legendlot/depot
