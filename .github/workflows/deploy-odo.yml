name: Deploy Odo

on:
  push:
    branches: [main]
    paths:
      - 'apps/odo/**'
      - 'packages/**'
      - '.github/workflows/deploy-odo.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Odo
        run: npx turbo build --filter=@throttle/odo
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: https://odoops.afshaan.workers.dev
          NEXT_PUBLIC_ODOOPS_URL: https://odoops.afshaan.workers.dev

      - name: Deploy to legendlot/odo
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: legendlot/odo
          publish_branch: gh-pages
          publish_dir: apps/odo/out
          cname: odo.legendoftoys.com
          commit_message: 'deploy: Odo (LOT Monorepo)'
          force_orphan: true
