name: Deploy Odo

on:
  push:
    branches: [main]
    paths:
      - 'apps/odo/**'
      - 'packages/**'
      # Root manifests were MISSING from this filter (pre-existing, not introduced by
      # S344): a dependency or turbo change could not rebuild this app at all.
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      # CI gates consumed by every workflow.
      - '.eslintrc.ci.json'
      - '.github/scripts/**'
      - '.github/workflows/deploy-odo.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint gate (S322). `next build` does NOT run these rules on this estate, so a
      # ReferenceError at render compiles clean and ships — that white-screened Pitstop /inbox
      # (S311) and left podium /appraisals/detail dead on every render until 2026-08-28.
      # rules-of-hooks + no-undef ONLY; exhaustive-deps stays off on purpose (it lights up
      # estate-wide and drowns the signal). Baseline was zero when this was wired.
      - name: Lint (rules-of-hooks + no-undef)
        run: npm run lint:ci

      - name: Build Odo
        run: |
          set -o pipefail
          npx turbo build --filter=@throttle/odo 2>&1 | tee /tmp/build-output.log
          bash .github/scripts/check-build-output.sh /tmp/build-output.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: https://odoops.afshaan.workers.dev
          NEXT_PUBLIC_ODOOPS_URL: https://odoops.afshaan.workers.dev

      - name: Deploy to legendlot/odo
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY_ODO }}
          external_repository: legendlot/odo
          publish_branch: gh-pages
          publish_dir: apps/odo/out
          cname: odo.legendoftoys.com
          commit_message: 'deploy: Odo (LOT Monorepo)'
          force_orphan: true

      # PATTERN-168 — a green gh-pages push is NOT a live deploy. Pages builds
      # asynchronously and can silently ERROR, serving the old build for days.
      # Fail-soft on auth: a monitoring gap must not become a deploy outage.
      - name: Verify GitHub Pages published
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bash .github/scripts/verify-pages.sh legendlot/odo apps/odo/out https://odo.legendoftoys.com/