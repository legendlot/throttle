name: Deploy Manifest

on:
  push:
    branches: [main]
    paths:
      - 'apps/manifest/**'
      - 'packages/**'
      - '.github/workflows/deploy-manifest.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Manifest
        run: npx turbo build --filter=@throttle/manifest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: https://manifestops.afshaan.workers.dev
          NEXT_PUBLIC_MANIFESTOPS_URL: https://manifestops.afshaan.workers.dev

      - name: Deploy to legendlot/manifest
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: legendlot/manifest
          publish_branch: gh-pages
          publish_dir: apps/manifest/out
          cname: manifest.legendoftoys.com
          commit_message: 'deploy: Manifest (LOT Monorepo)'
          force_orphan: true
