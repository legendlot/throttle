name: Deploy Redline

on:
  push:
    branches: [main]
    # Only rebuild this app when something it depends on changes (S344, 2026-09-04).
    # Every push used to trigger ALL TWELVE app workflows regardless of what changed:
    # with several lanes pushing, that reached 31 queued runs and ~25min per deploy.
    # Mirrors the filter deploy.yml (Throttle) has always had.
    # ⚠️ `packages/**` MUST stay: all twelve apps depend on @throttle/{ui,auth,db,domain},
    # so a package change has to rebuild every app or we ship a stale one and never know.
    paths:
      - 'apps/redline/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy-redline.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint gate (S322). `next build` does NOT run these rules on this estate, so a
      # ReferenceError at render compiles clean and ships — that white-screened Pitstop /inbox
      # (S311) and left podium /appraisals/detail dead on every render until 2026-08-28.
      # rules-of-hooks + no-undef ONLY; exhaustive-deps stays off on purpose (it lights up
      # estate-wide and drowns the signal). Baseline was zero when this was wired.
      - name: Lint (rules-of-hooks + no-undef)
        run: npm run lint:ci

      - name: Build Redline
        run: |
          set -o pipefail
          npx turbo build --filter=@throttle/redline 2>&1 | tee /tmp/build-output.log
          bash .github/scripts/check-build-output.sh /tmp/build-output.log
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: ${{ secrets.NEXT_PUBLIC_LOTOPS_URL }}

      - name: Deploy to legendlot/dashboard
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.DEPLOY_KEY_REDLINE }}
          external_repository: legendlot/dashboard
          publish_branch: gh-pages
          publish_dir: apps/redline/out
          cname: redline.legendoftoys.com
          commit_message: 'deploy: Redline React app (LOT Monorepo)'
          force_orphan: true

      # PATTERN-168 — a green gh-pages push is NOT a live deploy. Pages builds
      # asynchronously and can silently ERROR, serving the old build for days.
      # Fail-soft on auth: a monitoring gap must not become a deploy outage.
      - name: Verify GitHub Pages published
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: bash .github/scripts/verify-pages.sh legendlot/dashboard apps/redline/out https://redline.legendoftoys.com/