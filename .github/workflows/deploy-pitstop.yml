name: Deploy Pitstop

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Pitstop
        run: npx turbo build --filter=@throttle/pitstop
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: https://csops.afshaan.workers.dev
          NEXT_PUBLIC_CSOPS_URL: https://csops.afshaan.workers.dev

      - name: Deploy to legendlot/pitstop
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: legendlot/pitstop
          publish_branch: gh-pages
          publish_dir: apps/pitstop/out
          cname: pitstop.legendoftoys.com
          commit_message: 'deploy: Pitstop CS portal (LOT Monorepo)'
          force_orphan: true
