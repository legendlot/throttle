name: Deploy Salesops

on:
  push:
    branches: [main]
    paths:
      - 'apps/sales/**'
      - 'packages/**'
      - '.github/workflows/deploy-sales.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Salesops
        run: npx turbo build --filter=@throttle/sales
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_WORKER_URL: https://salesops.afshaan.workers.dev
          NEXT_PUBLIC_SALESOPS_URL: https://salesops.afshaan.workers.dev

      - name: Deploy to legendlot/sales
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: legendlot/sales
          publish_branch: gh-pages
          publish_dir: apps/sales/out
          cname: sales.legendoftoys.com
          commit_message: 'deploy: Salesops (LOT Monorepo)'
          force_orphan: true
