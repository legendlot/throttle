name = "odoops"
main = "src/index.js"
compatibility_date = "2026-05-28"
workers_dev = true

# Odo — LOT consolidated cross-channel sales dashboard worker (odo.legendoftoys.com).
# service_role on the SAME Supabase project as lotopsproxy/snorkelops/manifestops.
# Owns the `sales` schema (sales_fact, staging, sku_map, connector_*, upload_batch).
# Cross-schema READS: store.sales_orders/_lines (GT/MT), store.salesops_roles/_user_roles
# (perms), store.users_profile (auth), public.dispatch_channels + product_master.
# No cross-schema WRITES outside `sales`. No cross-worker calls.
# (Internal DB names keep the `sales`/`salesops_*` build identifiers — they predate the
#  Odo branding and are invisible to users; system/app/worker/domain are all "Odo".)

# Hourly cron is now a thin PRODUCER: it spawns one ConnectorWorkflow instance per enabled
# connector (single-flight). Each instance loops one window per step.do(), and each step gets
# its own 50-subrequest budget — so connectors no longer share one tick budget (the starvation
# that left daily sell-out connectors stale). Design spec:
# docs/superpowers/specs/2026-06-25-odo-ingestion-workflows-design.md.
[triggers]
# "0 * * * *"  = the connector producer + everything day-grain.
# "*/5 * * * *" = FAST PATH, Website inventory + stock-alert drain ONLY (see scheduled()).
#   Marketplace feeds deliberately stay hourly: Meta already 403s "Application request limit
#   reached" at hourly, Amazon is async batch, and sales_fact is day-grain.
crons = ["0 * * * *", "*/5 * * * *"]

[[workflows]]
name = "odoops-connector"
binding = "CONNECTOR_WF"
class_name = "ConnectorWorkflow"

# Secrets set via `wrangler secret put` — never stored in this file:
#   SUPABASE_SERVICE_KEY   (Supabase service_role sb_secret key — same project as lotopsproxy)
#   SHOPIFY_STORE_DOMAIN   (the LOT store — ed7e3f-cf.myshopify.com)
#   SHOPIFY_ACCESS_TOKEN   (custom app: static Admin API token shpat_… — PREFERRED for Develop-apps)
#   SHOPIFY_CLIENT_ID      (only for a Dev Dashboard app's client-credentials grant; not needed if ACCESS_TOKEN set)
#   SHOPIFY_CLIENT_SECRET
#   SHOPIFY_API_VERSION    (optional; defaults to 2026-04 in code)
# Phase 2/3 (later): AMAZON_LWA_CLIENT_ID/SECRET/REFRESH_TOKEN, FLIPKART_CLIENT_ID/SECRET.
