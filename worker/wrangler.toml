name = "throttleops"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = true

[vars]
SUPABASE_URL = "https://jkxcnjabmrkteanzoofj.supabase.co"

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_ANON_KEY
# SLACK_WEBHOOK_URL

[triggers]
crons = ["29 18 * * 3", "30 20 * * *"]
# "29 18 * * 3"  = Wed 18:29 UTC = Wed 23:59 IST — sprint close (Wed only)
# "30 20 * * *"  = daily 20:30 UTC = 02:00 IST — social analytics snapshot
#                  (captures the previous day's finalized reach + today's follower count)
# scheduled() gates sprint close to the Wed cron; social sync runs on every tick.

# Run next to the database (Supabase lot-production = AWS ap-south-1, Mumbai). Measured 2026-11-13:
# requests from India executed in Marseille, so every Supabase call crossed Europe<->Mumbai.
# A region hint, not mode = "smart" (that needs traffic from several locations). Proven on
# lotopsproxy first (calls ~40% faster, client IP preserved). Verify: `cf-placement` response
# header. Roll back: delete this block and redeploy. Kept LAST in the file on purpose — a table
# header placed above top-level keys would swallow them.
[placement]
region = "aws:ap-south-1"
