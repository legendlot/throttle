name = "podiumops"
main = "src/index.js"
compatibility_date = "2026-05-28"
workers_dev = true

[vars]
SUPABASE_URL = "https://jkxcnjabmrkteanzoofj.supabase.co"

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
#
# Deferred (Phase 6 — Google Workspace directory sync; graceful-until-set):
# GOOGLE_SA_JSON
# GOOGLE_ADMIN_IMPERSONATE_EMAIL

# Run next to the database (Supabase lot-production = AWS ap-south-1, Mumbai). Measured 2026-11-13:
# requests from India executed in Marseille, so every Supabase call crossed Europe<->Mumbai.
# A region hint, not mode = "smart" (that needs traffic from several locations). Proven on
# lotopsproxy and 8 other workers (calls ~40% faster, client IP preserved). Verify: `cf-placement`
# response header. Roll back: delete this block and redeploy. Kept LAST in the file on purpose —
# a table header placed above top-level keys would swallow them.
[placement]
region = "aws:ap-south-1"
