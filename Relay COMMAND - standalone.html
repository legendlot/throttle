document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-radius:5px;padding:2px 6px\">system<\u002Fspan><\u002Fsc-if><\u002Fspan><\u002Fdiv>\n                <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#71767c\">{{ r.key }}<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#8b909a;line-height:1.5;flex:1\">{{ r.desc }}<\u002Fdiv>\n                <div style=\"display:flex;align-items:baseline;gap:7px;padding-top:4px;border-top:1px solid #1e1f24\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#F2CD1A\">{{ r.perms }}<\u002Fspan><span style=\"font-size:12px;color:#71767c\">permissions granted<\u002Fspan><\u002Fdiv>\n                <div style=\"display:flex;gap:8px;margin-top:2px\">\n                  <button style=\"flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:#a3a8af;background:transparent;border:1px solid #2c2f36;border-radius:8px;padding:7px;cursor:pointer\" style-hover=\"color:#f4f5f6;border-color:#45484f\"><span class=\"ms\" style=\"font-size:15px\">{{ r.editIcon }}<\u002Fspan>{{ r.editLabel }}<\u002Fbutton>\n                  <button style=\"flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12px;font-weight:600;color:#a3a8af;background:transparent;border:1px solid #2c2f36;border-radius:8px;padding:7px;cursor:pointer\" style-hover=\"color:#f4f5f6;border-color:#45484f\"><span class=\"ms\" style=\"font-size:15px\">content_copy<\u002Fspan>Clone<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ─────────── ADMIN · USERS ─────────── -->\n      <sc-if value=\"{{ isUsers }}\">\n        <div style=\"padding:24px 26px 44px;animation:rfade .3s ease\">\n          <div style=\"margin-bottom:20px\"><h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#f4f5f6;letter-spacing:-.01em;lin      <div style=\"background:#141518;border:1px solid #212227;border-radius:14px;overflow:hidden\">\n            <div style=\"padding:13px 18px;border-bottom:1px solid #202128;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#f4f5f6\">Access list <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#71767c;font-weight:400\">5<\u002Fspan><\u002Fdiv>\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n              <sc-raw-thead><sc-raw-tr style=\"text-align:left\">\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">User<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Email<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Role<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Status<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Assigned<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ users }}\" as=\"u\" hint-placeholder-count=\"5\">\n                  <sc-raw-tr style=\"opacity:{{ u.opacity }}\">\ nt-weight:500;color:#e6e8ea\">{{ f.label }}<\u002Fdiv><div style=\"font-size:12px;color:#71767c;margin-top:3px;line-height:1.4\">{{ f.hint }}<\u002Fdiv><\u002Fdiv>\n                  <div style=\"flex:none\">{{ f.control }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ─────────── ADMIN · SENDER IDENTITIES ─────────── -->\n      <sc-if value=\"{{ isSenders }}\">\n        <div style=\"padding:24px 26px 44px;animation:rfade .3s ease\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px\">\n            <div><h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#f4f5f6;letter-spacing:-.01em;line-height:1\">Sender Identities<\u002Fh1><p style=\"color:#8b909a;font-size:13.5px;margin-top:8px\">From-addresses and channel senders. Email rows show DNS verification state.<\u002Fp><\u002Fdiv>\n            <button style=\"display:inline-flex;align-items:center;gap:7px;font-family:'Space Grotesk',sans-serif;font-size:12.5px;font-weight:600;color:#17140a;background:#F2CD1A;border:none;border-radius:9px;padding:9px 15px;cursor:pointer;box-shadow:0 6px 18px -8px rgba(242,205,26,.7)\" style-hover=\"filter:brightness(1.06)\"><span class=\"ms\" style=\"font-size:17px\">add<\u002Fspan>New sender<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"background:#141518;border:1px solid #212227;border-radius:14px;overflow:hidden\">\n            <div style=\"padding:13px 18px;border-bottom:1px solid #202128;font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#f4f5f6\">Senders <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#71767c;font-weight:400\">5<\u002Fspan><\u002Fdiv>\n            <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13px\">\n              <sc-raw-thead><sc-raw-tr style=\"text-align:left\">\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Channel<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Address<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Provider<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">Status<\u002Fsc-raw-th>\n                <sc-raw-th style=\"font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#71767c;font-weight:500;padding:11px 16px;border-bottom:1px solid #202128\">DNS<\u002Fsc-raw-th>\n              <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n              <sc-raw-tbody>\n                <sc-for list=\"{{ senders }}\" as=\"s\" hint-placeholder-count=\"5\">\n                  <sc-raw-tr style=\"cursor:pointer\" style-hover=\"background:rgba(255,255,255,.028)\">\n                    <sc-raw-td style=\"padding:12px 16px;border-bottom:1px solid #1a1b1f\"><span style=\"display:inline-flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:{{ s.chFg }}\"><span class=\"ms\" style=\"font-size:14px\">{{ s.chIcon }}<\u002Fspan>{{ s.channel }}<\u002Fspan><\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px 16px;border-bottom:1px solid #1a1b1f;font-family:'JetBrains Mono',monospace;font-size:12px;color:#e6e8ea\">{{ s.address }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px 16px;border-bottom:1px solid #1a1b1f;font-size:12.5px;color:#8b909a\">{{ s.provider }}<\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px 16px;border-bottom:1px solid #1a1b1f\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:6px;color:{{ s.stFg }};background:{{ s.stBg }};border:1px solid {{ s.stBd }}\">{{ s.status }}<\u002Fspan><\u002Fsc-raw-td>\n                    <sc-raw-td style=\"padding:12px 16px;border-bottom:1px solid #1a1b1f\">{{ s.dnsCell }}<\u002Fsc-raw-td>\n                  <\u002Fsc-raw-tr>\n                <\u002Fsc-for>\n              <\u002Fsc-raw-tbody>\n            <\u002Fsc-raw-table>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ─────────── ADMIN · CONNECTORS ─────────── -->\n      <sc-if value=\"{{ isConnectors }}\">\n        <div style=\"padding:24px 26px 44px;animation:rfade .3s ease\">\n          <div style=\"margin-bottom:20px\"><h1 style=\"font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#f4f5f6;letter-spacing:-.01em;line-height:1\">Connectors<\u002Fh1><p style=\"color:#8b909a;font-size:13.5px;margin-top:8px\">Provider wiring per channel. Read-only overview of configured senders plus data-sync tools.<\u002Fp><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px\">\n            <div style=\"background:#141518;border:1px solid #212227;border-radius:14px;padding:18px\">\n              <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:10px\"><span class=\"ms\" style=\"font-size:19px;color:#95bf47\">shopping_bag<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#f4f5f6\">Shopify — customer data sync<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8b909a;line-height:1.5;margin-bottom:14px\">Imports Shopify customers → profiles + identifiers + consent + attributes (idempotent). <strong style=\"color:#a3a8af\">No emails are sent<\u002Fstrong> — the Test Mode lock is separate.<\u002Fdiv>\n              <div style=\"display:flex;gap:9px\"><button style=\"font-size:12px;font-weight:600;color:#a3a8af;background:transparent;border:1px solid #2c2f36;border-radius:8px;padding:8px 13px;cursor:pointer\" style-hover=\"color:#f4f5f6;border-color:#45484f\">Dry-run: import 5<\u002Fbutton><button style=\"font-size:12px;font-weight:600;color:#17140a;background:#F2CD1A;border:none;border-radius:8px;padding:8px 13px;cursor:pointer\">Full sync — all customers<\u002Fbutton><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#141518;border:1px solid #212227;border-radius:14px;padding:18px\">\n              <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:10px\"><span class=\"ms\" style=\"font-size:19px;color:#7c9bff\">link<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#f4f5f6\">Cashfree — payment link<\u002Fspan><\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#8b909a;line-height:1.5;margin-bottom:14px\">Mints a Cashfree payment link (COD→prepaid). The link self-wires its callback, so paying it fires a <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#a3a8af\">payment_link_paid<\u002Fspan> event.<\u002Fdiv>\n              <button style=\"font-size:12px;font-weight:600;color:#17140a;background:#F2CD1A;border:none;border-radius:8px;padding:8px 13px;cursor:pointer\">Mint test link<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ connectorChannels }}\" as=\"ch\" hint-placeholder-count=\"3\">\n            <div style=\"background:#141518;border:1px solid #212227;border-radius:14px;overflow:hidden;margin-bottom:14px\">\n              <div style=\"padding:13px 18px;border-bottom:1px solid #202128;display:flex;align-items:center;gap:9px\"><span class=\"ms\" style=\"font-size:17px;color:{{ ch.chFg }}\">{{ ch.chIcon }}<\u002Fspan><span style=\"font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;color:#f4f5f6;text-transform:capitalize\">{{ ch.channel }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#71767c\">{{ ch.count }}<\u002Fspan><\u002Fdiv>\n              <sc-if value=\"{{ ch.hasNone }}\"><div style=\"padding:16px 18px;font-size:12.5px;color:#71767c\">No {{ ch.channel }} sender configured yet.<\u002Fdiv><\u002Fsc-if>\n              <sc-for list=\"{{ ch.senders }}\" as=\"s\" hint-placeholder-count=\"1\">\n                <div style=\"display:flex;align-items:center;gap:16px;padding:12px 18px;border-top:1px solid #1a1b1f\"><span style=\"flex:1;font-family:'JetBrains Mono',monospace;font-size:12px;color:#e6e8ea\">{{ s.address }}<\u002Fspan><span style=\"font-size:12px;color:#8b909a\">{{ s.provider }}<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;padding:3px 9px;border-radius:6px;color:{{ s.stFg }};background:{{ s.stBg }};border:1px solid {{ s.stBd }}\">{{ s.status }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { page: 'overview', collapsed: false };\n  nav(id) { this.setState({ page: id }); }\n\n  renderVals() {\n    const page = this.state.page;\n    const collapsed = this.state.collapsed;\n    const expanded = !collapsed;\n    const go = (id) => () => this.nav(id);\n\n    // ---- tone helpers ----\n    const ST = {\n      sent:      { fg:'#34d399', bg:'rgba(52,211,153,.13)',  bd:'rgba(52,211,153,.34)' },\n      sending:   { fg:'#fb923c', bg:'rgba(251,146,60,.15)',  bd:'rgba(251,146,60,.36)' },\n      scheduled: { fg:'#7c9bff', bg:'rgba(124,155,255,.15)', bd:'rgba(124,155,255,.34)' },\n      draft:     { fg:'#9aa0aa', bg:'rgba(255,255,255,.05)', bd:'rgba(255,255,255,.11)' },\n      pending:   { fg:'#f2cd1a', bg:'rgba(242,205,26,.13)',  bd:'rgba(242,205,26,.34)' },\n      active:    { fg:'#34d399', bg:'rgba(52,211,153,.13)',  bd:'rgba(52,211,153,.34)' },\n      archived:  { fg:'#9aa0aa', bg:'rgba(255,255,255,.05)', bd:'rgba(255,255,255,.11)' },\n      green:     { fg:'#34d399', bg:'rgba(52,211,153,.13)',  bd:'rgba(52,211,153,.34)' },\n      red:       { fg:'#f87171', bg:'rgba(248,113,113,.13)', bd:'rgba(248,113,113,.34)' },\n      yellow:    { fg:'#f2cd1a', bg:'rgba(242,205,26,.13)',  bd:'rgba(242,205,26,.34)' },\n      blue:      { fg:'#7c9bff', bg:'rgba(124,155,255,.15)', bd:'rgba(124,155,255,.34)' },\n      gray:      { fg:'#9aa0aa', bg:'rgba(255,255,255,.05)', bd:'rgba(255,255,255,.11)' },\n    };\n    const CH = {\n      email:    { label:'Email',    short:'EM', icon:'mail', fg:'#a3a8af', bg:'rgba(255,255,255,.06)' },\n      whatsapp: { label:'WhatsApp', short:'WA', icon:'chat', fg:'#25D366', bg:'rgba(37,211,102,.13)' },\n      sms:      { label:'SMS',      short:'SM', icon:'sms',  fg:'#7c9bff', bg:'rgba(124,155,255,.13)' },\n    };\n\n    // ---- nav ----\n    const navDef = [\n      { items: [{ id:'overview', label:'Overview', icon:'space_dashboard' }] },\n      { label:'Send',           items: [{ id:'campaigns', label:'Campaigns', icon:'campaign' }, { id:'journeys', label:'Journeys', icon:'fork_right' }] },\n      { label:'Audience',       items: [{ id:'segments', label:'Segments', icon:'filter_alt' }, { id:'contacts', label:'Contacts', icon:'contacts' }] },\n      { label:'Build & measure',items: [{ id:'templates', label:'Templates', icon:'mail' }, { id:'analytics', label:'Analytics', icon:'monitoring' }] },\n      { label:'Admin',          items: [{ id:'roles', label:'Roles', icon:'shield' }, { id:'users', label:'Users', icon:'group' }, { id:'settings', label:'Approval & Caps', icon:'tune' }, { id:'senders', label:'Sender Identities', icon:'alternate_email' }, { id:'connectors', label:'Connectors', icon:'cable' }] },\n    ];\n    const navGroups = navDef.map((g, gi) => ({\n      label: g.label || '',\n      showLabel: !!g.label && expanded,\n      showRule: !!g.label && collapsed && gi > 0,\n      items: g.items.map(it => {\n        const active = it.id === page;\n        return { ...it, active, onClick: go(it.id),\n          justify: collapsed ? 'center' : 'flex-start',\n          fg: active ? '#F2CD1A' : '#a3a8af',\n          bg: active ? 'rgba(242,205,26,.12)' : 'transparent',\n          weight: active ? 600 : 500 };\n      }),\n    }));\n\n    // ---- breadcrumb ----\n    const CRUMB = {\n      overview:{g:'HOME',p:'OVERVIEW'}, campaigns:{g:'SEND',p:'CAMPAIGNS'}, journeys:{g:'SEND',p:'JOURNEYS'},\n      segments:{g:'AUDIENCE',p:'SEGMENTS'}, contacts:{g:'AUDIENCE',p:'CONTACTS'},\n      templates:{g:'BUILD',p:'TEMPLATES'}, analytics:{g:'BUILD',p:'ANALYTICS'},\n      roles:{g:'ADMIN',p:'ROLES'}, users:{g:'ADMIN',p:'USERS'}, settings:{g:'ADMIN',p:'APPROVAL & CAPS'},\n      senders:{g:'ADMIN',p:'SENDER IDENTITIES'}, connectors:{g:'ADMIN',p:'CONNECTORS'},\n    };\n    const crumb = CRUMB[page] || CRUMB.overview;\n\n    // ---- campaigns ----\n    const rawC = [\n      { name:'July Win-Back Flow',   channel:'email',    purpose:'marketing',     tone:'sent',      statusLabel:'Sent',            when:'Sent Jul 21',            delivered:'8,180', deliveredPct:'97.2%', read:'41.3%', click:'6.8%',  revenue:'₹3.24L', roi:'5.9×', roiPos:true },\n      { name:'Order Shipped',        channel:'whatsapp', purpose:'transactional', tone:'sending',   statusLabel:'In progress',     when:'Sending now',            delivered:'598',   deliveredPct:'97.7%', read:'88.1%', click:'12.4%', revenue:'—',      roi:'—',    roiPos:false },\n      { name:'Monsoon Sale Blast',   channel:'email',    purpose:'marketing',     tone:'scheduled', statusLabel:'Scheduled',       when:'Fires Jul 26 · 9:00 AM', delivered:'—',     deliveredPct:'—',     read:'—',     click:'—',     revenue:'—',      roi:'—',    roiPos:false },\n      { name:'Abandoned Cart Nudge', channel:'whatsapp', purpose:'marketing',     tone:'sent',      statusLabel:'Sent',            when:'Sent Jul 20',            delivered:'3,020', deliveredPct:'97.8%', read:'79.2%', click:'18.6%', revenue:'₹1.87L', roi:'8.2×', roiPos:true },\n      { name:'Diwali Early Access',  channel:'email',    purpose:'marketing',     tone:'draft',     statusLabel:'Draft',           when:'Edited 2h ago',          delivered:'—',     deliveredPct:'—',     read:'—',     click:'—',     revenue:'—',      roi:'—',    roiPos:false },\n      { name:'VIP Restock Alert',    channel:'whatsapp', purpose:'marketing',     tone:'pending',   statusLabel:'Pending approval',when:'Submitted 40m ago',      delivered:'—',     deliveredPct:'—',     read:'—',     click:'—',     revenue:'—',      roi:'—',    roiPos:false },\n      { name:'Feedback Request',     channel:'email',    purpose:'utility',       tone:'sent',      statusLabel:'Sent',            when:'Sent Jul 19',            delivered:'5,310', deliveredPct:'98.5%', read:'33.1%', click:'4.2%',  revenue:'—',      roi:'—',    roiPos:false },\n    ];\n    const campaigns = rawC.map((r,i) => { const t=ST[r.tone], c=CH[r.channel]; return { ...r, id:'c'+i, sFg:t.fg,sBg:t.bg,sBd:t.bd, chLabel:c.label,chShort:c.short,chFg:c.fg,chBg:c.bg, purposeLabel:r.purpose[0].toUpperCase()+r.purpose.slice(1), roiColor:r.roiPos?'#34d399':'#71767c' }; });\n\n    const mkTabs = (defs) => defs.map((d,i) => ({ ...d, weight:i===0?600:500, fg:i===0?'#F2CD1A':'#8b909a', bg:i===0?'rgba(242,205,26,.12)':'transparent' }));\n    const campaignTabs = mkTabs([{label:'All broadcasts',count:7},{label:'Scheduled',count:1},{label:'Drafts',count:2},{label:'Sent',count:3}]);\n\n    const mkKpi = (label,value,delta,opt={}) => ({ label,value,delta, accent:!!opt.accent, color:opt.color||'#f4f5f6', deltaColor:opt.deltaColor||(delta&&delta[0]==='▲'?'#34d399':'#8b909a') });\n    const campaignKpis = [\n      mkKpi('Sent · 7d','26,340','▲ 12.4%',{accent:true}),\n      mkKpi('Delivery','97.6%','▲ 0.4%'),\n      mkKpi('Read rate','44.2%','▲ 3.1%'),\n      mkKpi('Attr. revenue','₹5.11L','last-touch · 7d'),\n      mkKpi('Blended ROI','6.4×','rev ÷ spend',{color:'#F2CD1A'}),\n    ];\n\n    // ---- overview ----\n    const overviewKpis = [\n      mkKpi('Sent · 7d','26,340','▲ 12.4%',{accent:true}),\n      mkKpi('Delivery','97.6%','▲ 0.4%'),\n      mkKpi('Read rate','44.2%','▲ 3.1%'),\n      mkKpi('Attr. revenue','₹5.11L','▲ 18.2%'),\n      mkKpi('Blended ROI','6.4×','rev ÷ spend',{color:'#F2CD1A'}),\n    ];\n    const liveSends = [\n      { name:'Order Shipped · WhatsApp', channel:'whatsapp', pct:49, progress:'612 / 1,240', eta:'~6 min left' },\n      { name:'Weekly Digest · Email',    channel:'email',    pct:78, progress:'9,360 / 12,000', eta:'~3 min left' },\n    ].map(s => { const c=CH[s.channel]; return { ...s, chIcon:c.icon, chFg:c.fg, chBg:c.bg }; });\n    const activity = [\n      { icon:'check_circle', color:'#34d399', text:'\"July Win-Back Flow\" finished sending — 8,180 delivered', time:'12m' },\n      { icon:'schedule',     color:'#7c9bff', text:'\"Monsoon Sale Blast\" scheduled for Jul 26, 9:00 AM', time:'34m' },\n      { icon:'pending',      color:'#f2cd1a', text:'\"VIP Restock Alert\" submitted for approval by Rhea', time:'40m' },\n      { icon:'fork_right',   color:'#a3a8af', text:'Journey \"Abandoned Cart\" enrolled 214 new profiles', time:'1h' },\n      { icon:'error',        color:'#f87171', text:'14 messages failed on hello@ — soft bounce retry queued', time:'2h' },\n    ];\n    const senderHealth = [\n      { address:'hello@legendoftoys.com', channel:'email',    delivered:'18,240', quality:'HEALTHY', tone:'green' },\n      { address:'care@legendoftoys.com',  channel:'email',    delivered:'5,310',  quality:'HEALTHY', tone:'green' },\n      { address:'+91 70191 03926',        channel:'whatsapp', delivered:'2,790',  quality:'HIGH',    tone:'green' },\n      { address:'offers@legendoftoys.com',channel:'email',    delivered:'980',    quality:'WATCH',   tone:'yellow' },\n    ].map(h => { const t=ST[h.tone]; return { ...h, qFg:t.fg, qBg:t.bg, qBd:t.bd }; });\n\n    // ---- journeys ----\n    const rawJ = [\n      { name:'Abandoned Cart',       trigger:'event: checkout_started', on:true,  version:4, enrolled:'1,240', conv:'6.2%', revenue:'₹4.12L', read:'79.2%', lastActivity:'2m ago' },\n      { name:'Welcome Series',       trigger:'event: profile_created',  on:true,  version:7, enrolled:'3,180', conv:'4.1%', revenue:'₹2.02L', read:'62.4%', lastActivity:'18m ago' },\n      { name:'Post-Purchase Nudge',  trigger:'event: order_delivered',  on:false, version:2, enrolled:'860',   conv:'8.8%', revenue:'₹1.44L', read:'71.0%', lastActivity:'Jul 18' },\n      { name:'Win-Back 90d',         trigger:'enters: Lapsed buyers',   on:false, version:3, enrolled:'2,020', conv:'3.4%', revenue:'₹96k',   read:'48.9%', lastActivity:'Jul 15' },\n      { name:'Birthday Reward',      trigger:'event: birthday_today',   on:false, version:1, enrolled:'—',     conv:'—',    revenue:'—',      read:'—',     lastActivity:'Draft' },\n    ];\n    const journeys = rawJ.map((j,i) => ({ ...j, id:'j'+i,\n      onLabel:j.on?'ON':'OFF', onFg:j.on?'#34d399':'#565b61',\n      swBg:j.on?'rgba(52,211,153,.2)':'rgba(255,255,255,.06)', swBd:j.on?'rgba(52,211,153,.5)':'rgba(255,255,255,.14)',\n      knobBg:j.on?'#34d399':'#71767c', knobX:j.on?'16px':'2px' }));\n\n    // ---- segments ----\n    const rawS = [\n      { name:'Lapsed buyers · 90 days', kind:'dynamic', conditions:'3 · match all', members:'2,020', updated:'Jul 21' },\n      { name:'VIP · LTV > ₹25k',        kind:'dynamic', conditions:'2 · match all', members:'418',   updated:'Jul 20' },\n      { name:'Bengaluru · opted-in',    kind:'dynamic', conditions:'2 · match all', members:'6,240', updated:'Jul 19' },\n      { name:'Internal staff (test)',   kind:'static',  conditions:'—',             members:'32',    updated:'Jul 12' },\n      { name:'Cart abandoners · 7d',    kind:'dynamic', conditions:'1 · match any', members:'1,180', updated:'Jul 22' },\n    ];\n    const segments = rawS.map((s,i) => { const t = s.kind==='dynamic'?ST.blue:ST.gray; return { ...s, id:'s'+i, kFg:t.fg,kBg:t.bg,kBd:t.bd }; });\n\n    // ---- contacts ----\n    const rawP = [\n      { name:'Aarav Mehta',    city:'Mumbai',    consent:'opted_in',  orders:'12', ltv:'42,300', added:'Jun 02' },\n      { name:'Diya Sharma',    city:'Bengaluru', consent:'opted_in',  orders:'7',  ltv:'28,900', added:'Jun 14' },\n      { name:'Kabir Nair',     city:'Delhi',     consent:'opted_out', orders:'3',  ltv:'9,100',  added:'May 28' },\n      { name:'Ananya Rao',     city:'Hyderabad', consent:'opted_in',  orders:'21', ltv:'71,400', added:'Apr 09' },\n      { name:'Vivaan Gupta',   city:'Pune',      consent:'unknown',   orders:'1',  ltv:'2,400',  added:'Jul 11' },\n      { name:'Ishani Bose',    city:'Kolkata',   consent:'opted_in',  orders:'9',  ltv:'33,050', added:'Mar 22' },\n      { name:'Reyansh Iyer',   city:'Chennai',   consent:'opted_in',  orders:'5',  ltv:'18,700', added:'Jul 03' },\n    ];\n    const cTone = { opted_in:ST.green, opted_out:ST.red, unknown:ST.gray };\n    const contacts = rawP.map((p,i) => { const t=cTone[p.consent]; return { ...p, id:'p'+i, initials:p.name.split(' ').map(w=>w[0]).join('').slice(0,2), cFg:t.fg,cBg:t.bg,cBd:t.bd }; });\n\n    // ---- templates ----\n    const rawT = [\n      { name:'Win-back · 30 days',    channel:'email',    purpose:'marketing',     status:'active',  meta:null,        version:3, updated:'Jul 21' },\n      { name:'Order Shipped',         channel:'whatsapp', purpose:'transactional', status:'active',  meta:'APPROVED',  version:2, updated:'Jul 20' },\n      { name:'Monsoon Sale',          channel:'email',    purpose:'marketing',     status:'draft',   meta:null,        version:1, updated:'Jul 22' },\n      { name:'VIP Restock Alert',     channel:'whatsapp', purpose:'marketing',     status:'draft',   meta:'PENDING',   version:1, updated:'Jul 22' },\n      { name:'Feedback Request',      channel:'email',    purpose:'utility',       status:'active',  meta:null,        version:5, updated:'Jul 19' },\n      { name:'Payment Reminder',      channel:'whatsapp', purpose:'utility',       status:'archived',meta:'REJECTED',  version:2, updated:'Jul 05' },\n    ];\n    const metaTone = { APPROVED:ST.green, PENDING:ST.yellow, REJECTED:ST.red };\n    const tStatusTone = { active:ST.green, draft:ST.gray, archived:ST.red };\n    const templates = rawT.map((t,i) => {\n      const c=CH[t.channel], st=tStatusTone[t.status];\n      let metaCell = React.createElement('span',{style:{color:'#565b61'}},'—');\n      if (t.channel==='whatsapp') {\n        if (t.meta) { const m=metaTone[t.meta]||ST.gray; metaCell = React.createElement('span',{style:{fontFamily:\"'JetBrains Mono',monospace\",fontSize:'10px',padding:'3px 9px',borderRadius:'6px',color:m.fg,background:m.bg,border:'1px solid '+m.bd}},t.meta); }\n        else metaCell = React.createElement('span',{style:{fontFamily:\"'JetBrains Mono',monospace\",fontSize:'11px',color:'#71767c'}},'not submitted');\n      }\n      return { ...t, id:'t'+i, chIcon:c.icon, chFg:c.fg, sFg:st.fg,sBg:st.bg,sBd:st.bd, metaCell };\n    });\n\n    // ---- analytics ----\n    const analyticsKpis = [\n      { label:'Sent · 30d', value:'112,400', color:'#f4f5f6', sub:'handed to provider' },\n      { label:'Delivery rate', value:'97.4%', color:'#34d399', sub:'109,480 delivered' },\n      { label:'Read rate', value:'43.8%', color:'#34d399', sub:'47,950 read · of delivered' },\n      { label:'Attr. revenue', value:'₹18.6L', color:'#F2CD1A', sub:'campaigns + journeys' },\n    ];\n    const barSeed = [42,55,48,61,58,72,66,80,74,69,88,82,95,90];\n    const sendBars = barSeed.map((v,i) => ({ label:(11+i)+'', sentPct: Math.round(v/95*100), delivPct: 92 + (i%5) }));\n    const rawA = [\n      { name:'July Win-Back Flow',   sent:'8,180', delivered:'7,951', opened:'3,284', orders:'186', revenue:'₹3.24L', roi:'5.9×', roiPos:true },\n      { name:'Abandoned Cart Nudge', sent:'3,020', delivered:'2,954', opened:'2,340', orders:'142', revenue:'₹1.87L', roi:'8.2×', roiPos:true },\n      { name:'Order Shipped',        sent:'1,240', delivered:'1,212', opened:'1,068', orders:'—',   revenue:'—',      roi:'—',    roiPos:false },\n      { name:'Feedback Request',     sent:'5,310', delivered:'5,231', opened:'1,732', orders:'—',   revenue:'—',      roi:'—',    roiPos:false },\n    ];\n    const analyticsRows = rawA.map((c,i) => ({ ...c, id:'a'+i, roiColor:c.roiPos?'#34d399':'#71767c' }));\n\n    // ---- roles ----\n    const rawR = [\n      { label:'Super Admin',       key:'relay_super_admin', system:true,  perms:10, desc:'Full control — roles, settings, caps, and all sends.' },\n      { label:'Campaign Manager',  key:'campaign_manager',  system:false, perms:6,  desc:'Build and send campaigns & journeys, manage templates and segments.' },\n      { label:'Approver',          key:'approver',          system:false, perms:3,  desc:'Review and approve sends that cross the approval threshold.' },\n      { label:'Analyst',           key:'analyst',           system:false, perms:1,  desc:'Read-only access to the Relay workspace and analytics.' },\n      { label:'Data Steward',      key:'data_steward',      system:false, perms:2,  desc:'Manage contact data and consent records.' },\n      { label:'Viewer',            key:'relay_viewer',      system:true,  perms:1,  desc:'View campaigns, journeys, segments, and templates.' },\n    ];\n    const roles = rawR.map((r,i) => ({ ...r, id:'r'+i, editLabel:r.system?'View':'Edit', editIcon:r.system?'visibility':'edit' }));\n\n    // ---- users ----\n    const rawU = [\n      { name:'Afshaan Khan
