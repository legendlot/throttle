name = "commsops"
main = "src/index.js"
compatibility_date = "2026-05-28"
workers_dev = true

# Phase-B short-link host. lottoys.in serves ONLY /r/<code>; every other path on it 302s to
# legendoftoys.com (top of fetch(), gated on LINK_HOST below).
#
# ⚠️ This hostname is FROZEN once the first WhatsApp template is approved against it or the first
# QR code is printed — both put the URL somewhere we cannot recall. Changing it later means a full
# Meta re-approval wave AND dead artwork. Treat it as permanent.
#
# workers_dev stays true: the *.workers.dev host remains the API surface for /ingest, /send and the
# webhooks, which must NOT move to a customer-facing domain.
routes = [
  { pattern = "lottoys.in", custom_domain = true }
]

# Relay — LOT's CX comms orchestration worker. service_role on the SAME Supabase
# project as lotopsproxy/docketops/manifestops. Owns the `comms` schema (profiles,
# identifiers, events, consent, suppressions, segments, templates, messages,
# campaigns, journeys, enrolments) and is the ONLY DB client for the Relay app.
# Reads the relayops permission layer from store.relayops_roles/user_roles.

[vars]
SUPABASE_URL = "https://jkxcnjabmrkteanzoofj.supabase.co"
# Phase-B short-link host. This domain serves ONLY /r/<code>; every other path on it 302s to
# legendoftoys.com (see the top of fetch()), because someone typing the bare domain off a printed
# box must not meet a 401 from the auth block. Scoped by hostname so the API host is unaffected.
# NB this is the HOST; the URL the app builds links from is comms.settings.link_base_url, which is
# the feature's off switch and is set separately.
LINK_HOST = "lottoys.in"
# Cashfree environment for the payment-link mint (J3). production → api.cashfree.com;
# anything else → sandbox.cashfree.com (default). LOT's Cashfree account is live
# (same account powering the website/Shopflo), so the keys are production keys.
CASHFREE_ENV = "production"

# Turnstile SITE key for the /f/* public capture surface (S331 SP1). PUBLIC BY DESIGN — it is
# embedded in the widget JS every visitor downloads, so it is a var, not a secret. Its private
# half is the TURNSTILE_SECRET wrangler secret; an unset secret fails the challenge CLOSED, which
# disables capture rather than opening it.
TURNSTILE_SITE_KEY = "0x4AAAAAAEk4E0k_n904j-jG"

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# INGEST_TOKEN              (M3 — shared bearer for the internal /ingest seam)
# RESEND_API_KEY           (M5)
# SHOPIFY_WEBHOOK_SECRET   (M4)
# RESEND_WEBHOOK_SECRET    (M5)
# SLACK_WEBHOOK_ALERTS     (M9 — Slack Incoming Webhook → #relay-alerts; same convention as throttleops SLACK_WEBHOOK_OPS/_TEAM. Optional: alerts no-op if unset.)
# TURNSTILE_SECRET         (S331 — Cloudflare Turnstile siteverify secret for the public /f/* capture surface. Its absence fails the challenge CLOSED, so an unset secret disables capture rather than opening it.)

# Broadcast fan-out (M6) — throttled campaign sends, respects the 50-subrequest limit.
[[queues.producers]]
queue = "commsops-broadcast"
binding = "BROADCAST_QUEUE"

# max_batch_size=1: each message paginates its own small recipient chunk and
# self-enqueues the next, so one invocation stays well under the 50-subrequest limit.
# dead_letter_queue (M9): a message that exhausts max_retries is routed to commsops-dlq
# instead of being dropped — its consumer records it + alerts.
[[queues.consumers]]
queue = "commsops-broadcast"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "commsops-dlq"

# Dead-letter consumer (M9) — poison enrol/campaign/backfill messages land here; the
# queue() handler writes a comms.queue_failures row + fires a Slack alert, then acks.
[[queues.consumers]]
queue = "commsops-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 1

# Cron (M9) — every 5 min: fire due scheduled campaigns + watch deliverability. The
# scheduled() handler runs runScheduled(); the atomic claim in startCampaign guards
# against a concurrent manual send double-firing.
[triggers]
crons = ["*/5 * * * *"]

# Journey engine (M7) — each enrolment is one durable Workflow instance.
# step.sleep handles multi-day waits with no resource cost; step.do gives
# retryable send/condition units. New infra for the monorepo (Workflows-only,
# no Durable Object — the Queue producer/consumer above is reused for enrol fan-out).
[[workflows]]
name = "commsops-journey"
binding = "JOURNEY_WORKFLOW"
class_name = "JourneyWorkflow"

# Service binding to csops — REQUIRED for the inbound WhatsApp forward. A Worker cannot fetch()
# another Worker on the same workers.dev zone (Cloudflare error 1042), and forwardToCsops()
# swallows its errors, so without this every inbound customer message would vanish silently at
# cutover and Pitstop would show an empty inbox with nothing in the logs.
[[services]]
binding = "CSOPS"
service = "csops"
