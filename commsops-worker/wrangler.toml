name = "commsops"
main = "src/index.js"
compatibility_date = "2026-05-28"
workers_dev = true

# Relay — LOT's CX comms orchestration worker. service_role on the SAME Supabase
# project as lotopsproxy/docketops/manifestops. Owns the `comms` schema (profiles,
# identifiers, events, consent, suppressions, segments, templates, messages,
# campaigns, journeys, enrolments) and is the ONLY DB client for the Relay app.
# Reads the relayops permission layer from store.relayops_roles/user_roles.

[vars]
SUPABASE_URL = "https://jkxcnjabmrkteanzoofj.supabase.co"

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# INGEST_TOKEN              (M3 — shared bearer for the internal /ingest seam)
# RESEND_API_KEY           (M5)
# SHOPIFY_WEBHOOK_SECRET   (M4)
# RESEND_WEBHOOK_SECRET    (M5)

# Broadcast fan-out (M6) — throttled campaign sends, respects the 50-subrequest limit.
[[queues.producers]]
queue = "commsops-broadcast"
binding = "BROADCAST_QUEUE"

# max_batch_size=1: each message paginates its own small recipient chunk and
# self-enqueues the next, so one invocation stays well under the 50-subrequest limit.
[[queues.consumers]]
queue = "commsops-broadcast"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
