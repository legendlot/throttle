name = "ignitionops"
main = "src/index.js"
compatibility_date = "2026-05-28"
workers_dev = true

[vars]
SUPABASE_URL = "https://jkxcnjabmrkteanzoofj.supabase.co"
CSOPS_URL = "https://csops.afshaan.workers.dev"

# Service binding to csops — worker-to-worker calls (the Connects bridge +
# openPitstopTicket) MUST go via this binding, not a public workers.dev fetch,
# which Cloudflare blocks with error 1042 (same-zone worker-to-worker). S177.
[[services]]
binding = "CSOPS"
service = "csops"

# Service binding to commsops — the campaign-link seam (POST /internal/campaign-link,
# S313). Same reason as CSOPS above: a public workers.dev fetch between two workers on
# the same zone is blocked by Cloudflare error 1042 (surfaces as a 404). Auth still
# travels on the request (COMMSOPS_LINK_TOKEN) — the binding is transport, not trust.
[[services]]
binding = "COMMSOPS"
service = "commsops"

# Service binding to snorkelops — Ignition creator payment requests (Reann #2 S3): POST
# /internal/ignition (ignitionRaisePayment / ignitionGetPaymentStatus), bearer
# IGNITION_INTERNAL_TOKEN. Same 1042 reason as above.
[[services]]
binding = "SNORKELOPS"
service = "snorkelops"

# Cron triggers (handler branches on event.cron — each tick is its own subrequest budget):
#   20 2 * * *  (07:50 IST daily) — UGC Meta ad-metrics pull (Batch C2, S177). Per-ad-id
#               only (scoped to meta_ad_id on UGC deals), never an account sweep (that's Odo).
#   10 3 * * *  (08:40 IST daily) — coupon-redemption reconcile off Shopify (S214). Drains
#               COUPON_SYNC_MAX active codes/pass, oldest-synced first; refund-aware.
#   30 3 * * 1  (09:00 IST Mondays) — Shopify variant-price cache refresh (goodies auto-fill).
#   */15 * * * * (every 15 min) — Snorkel payment-request reconcile + stuck-send re-send (Reann #2 S3).
[triggers]
crons = ["20 2 * * *", "10 3 * * *", "30 3 * * 1", "*/15 * * * *"]

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# META_SYSTEM_USER_TOKEN  (same permanent System User token as odoops; arms C2)

# Run next to the database (Supabase lot-production = AWS ap-south-1, Mumbai). Measured 2026-11-13:
# requests from India executed in Marseille, so every Supabase call crossed Europe<->Mumbai.
# A region hint, not mode = "smart" (that needs traffic from several locations). Proven on
# lotopsproxy first (calls ~40% faster, client IP preserved). Verify: `cf-placement` response
# header. Roll back: delete this block and redeploy. Kept LAST in the file on purpose — a table
# header placed above top-level keys would swallow them.
[placement]
region = "aws:ap-south-1"
