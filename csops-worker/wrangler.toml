name = "csops"
main = "src/index.js"
compatibility_date = "2026-05-26"
workers_dev = true

[vars]
SUPABASE_URL = "https://jkxcnjabmrkteanzoofj.supabase.co"
# Pitstop's WhatsApp agent-reply transport. Flipped to "relay" at the support-number
# cutover on 2026-07-30 20:1x IST, when +91 98802 12323 moved off BiteSpeed onto LOT
# WABA 1350960337019398 (new phone_number_id 1266501519877668).
#
# Why this flag still matters even though routing is per-thread: isRelayThread() treats a
# thread as Relay when the GLOBAL flag is "relay" OR it carries waba_phone_number_id with
# no provider_thread_ref. The ~10,405 pre-existing threads DO carry a provider_thread_ref,
# so without this they route to BiteSpeed — which no longer owns the number — and every
# agent reply on an existing conversation fails. Messages visible, unanswerable: the exact
# S245 failure that cost 342 customer messages nine days of silence.
#
# channel='web' always stays on Chatwoot regardless of this value.
WA_TRANSPORT = "relay"

# Inbound email poll (Pitstop email channel, S175) — scheduled() polls carecrew@
# via the Gmail API every 2 min. Inert (no-op) until the GMAIL_SA_* secrets are set.
[triggers]
crons = ["*/2 * * * *"]

# Service bindings — REQUIRED, not an optimisation. A Worker cannot fetch() another Worker on
# the same workers.dev zone: Cloudflare returns error 1042 and the call 404s. csops talks to
# commsops (Relay /ingest + /send at the WhatsApp cutover) and to odoops (on-demand courier
# refresh), so both must go over a binding rather than a public URL. The HTTP paths are kept as
# a fallback for local/dev where the binding is absent.
[[services]]
binding = "COMMSOPS"
service = "commsops"

[[services]]
binding = "ODOOPS"
service = "odoops"

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# GOOGLE_SA_JSON          (full service-account key JSON — REUSE the shared SA that
#                          odoops/podiumops use; it already has gmail.modify DWD'd)
# INGEST_TOKEN            (commsops /ingest + /send service-to-service token)
# Optional vars (have code fallbacks): COMMSOPS_URL, GMAIL_MAILBOX (=carecrew@legendoftoys.com)
