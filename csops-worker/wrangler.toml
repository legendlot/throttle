name = "csops"
main = "src/index.js"
compatibility_date = "2026-05-26"
workers_dev = true

[vars]
SUPABASE_URL = "https://jkxcnjabmrkteanzoofj.supabase.co"

# Inbound email poll (Pitstop email channel, S175) — scheduled() polls carecrew@
# via the Gmail API every 2 min. Inert (no-op) until the GMAIL_SA_* secrets are set.
[triggers]
crons = ["*/2 * * * *"]

# Secrets set via `wrangler secret put` — never stored in this file:
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY
# GOOGLE_SA_JSON          (full service-account key JSON — REUSE the shared SA that
#                          odoops/podiumops use; it already has gmail.modify DWD'd)
# INGEST_TOKEN            (commsops /ingest + /send service-to-service token)
# Optional vars (have code fallbacks): COMMSOPS_URL, GMAIL_MAILBOX (=carecrew@legendoftoys.com)
